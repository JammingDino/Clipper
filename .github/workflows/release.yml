name: Release

# Every push to main builds clipper.exe, tags the next version and publishes a GitHub release.
# Version bump comes from commit messages since the last tag:
#   "#major" or "BREAKING CHANGE" -> major, "#minor" or "feat:" -> minor, anything else -> patch.
# Put "#skip-release" in a commit message to skip.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '#skip-release') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version
        id: ver
        shell: bash
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=1.0.0
          else
            if [ "$(git rev-list -n1 "$last")" = "$(git rev-parse HEAD)" ]; then
              echo "HEAD is already tagged $last, nothing to release"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            IFS=. read -r major minor patch <<< "${last#v}"
            log=$(git log --format='%s%n%b' "$last..HEAD")
            if grep -qE '#major|BREAKING CHANGE' <<< "$log"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -qE '#minor|^feat(\(.*\))?!?:' <<< "$log"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="$major.$minor.$patch"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Releasing v$next (previous: ${last:-none})"

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        shell: cmd
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: build.bat

      - name: Self-test
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $p = Start-Process .\clipper.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Tag and release
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" clipper.exe --title "Clipper $TAG" --generate-notes
